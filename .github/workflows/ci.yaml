name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm turbo lint typecheck build
      - name: Generate GraphQL schema
        run: pnpm turbo run schema
      - name: Check committed GraphQL schema
        run: |
          if [ -n "$(git status --porcelain -- packages/graphql)" ]; then
            git status --short -- packages/graphql
            git diff -- packages/graphql
            echo "::error file=packages/graphql/schema.graphql,title=Schema out of date::Run pnpm schema and commit the result."
            exit 1
          fi